spring.application.name=Source
spring.thymeleaf.cache=false

# Đọc biến môi trường từ file .env (nếu có) trong thư mục chạy ứng dụng.
spring.config.import=optional:file:.env[.properties]

# Cấu hình Gemini API.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.live-model=${GEMINI_LIVE_MODEL:gemini-3.8-live}
# Phiên bản API cho Live API + ephemeral token (theo tài liệu: v1beta).
gemini.live-api-version=${GEMINI_LIVE_API_VERSION:v1beta}
gemini.base-url=https://generativelanguage.googleapis.com

# Giới hạn dung lượng file tải lên (tối đa 5MB mỗi file, CV + JD trong một lần gửi).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-swallow-size=20MB
